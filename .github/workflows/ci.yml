name: CI

# Source preflight and frontend build on every push to main and every pull request.
# Native gates (real CoD4x core, Python 2.7 + eBc-B3, MariaDB) need local game files
# and the WSL test environment; on CI runners they skip themselves explicitly.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Preflight (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    env:
      # Electron binaries are only needed to package the installer, not for preflight/build.
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      # The default Windows TEMP is an 8.3 short path (C:\Users\RUNNER~1\...). Instance path
      # checks compare real paths and fail closed on it, so tests get a long-name TEMP.
      - name: Use long-path TEMP
        shell: bash
        run: |
          echo "TEMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "TMP=$RUNNER_TEMP" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Preflight
        run: npm run preflight

      - name: Build
        run: npm run build
